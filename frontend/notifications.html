<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c8102e">
    <title>Notifications | Drop of Hope</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/pages.css">
  </head>
  <body>
    <main data-page="notifications">
      <div class="section-heading">
        <div><span class="eyebrow">Your updates</span><h1>Notifications</h1></div>
        <button id="mark-all-read" class="button button--secondary" type="button">Mark all as read</button>
      </div>
      <p id="notifications-message" role="status" aria-live="polite"></p>
      <div id="notifications-list" class="stack" aria-live="polite" aria-busy="true">
        <div class="skeleton" aria-hidden="true"></div>
      </div>
    </main>
    <script type="module" src="./js/layout.js"></script>
    <script type="module" src="./js/notifications.js"></script>
  </body>
</html>
